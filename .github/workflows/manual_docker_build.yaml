name: Manual Docker Multi-Arch Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get_version:
    name: Get PyPI Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.fetch.outputs.version }}
    steps:
      - id: fetch
        run: curl -s https://pypi.org/pypi/flama/json | jq -r '"version=\(.info.version)"' >> "$GITHUB_OUTPUT"

  docker:
    name: Docker
    needs: [get_version]
    uses: ./.github/workflows/_docker.yaml
    with:
      version: ${{ needs.get_version.outputs.version }}
    secrets: inherit
