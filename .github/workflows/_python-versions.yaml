name: Python versions

# Single source of truth for the Python versions Flama supports across every workflow.
# To add or drop a version, edit the `versions` array below — nothing else in CI hard-codes it.
# Consumers read the `versions` (JSON array) and `default` outputs; any consumer-specific
# formatting (e.g. maturin's -i interpreter flags) is derived by the consumer that needs it.
# `default` drives the release, the benchmarks and the `latest` Docker tags. It is set explicitly rather than
# derived from `versions`, so a newly supported Python does not silently change the interpreter benchmarks are
# measured on, whose instruction counts are compared release over release.
on:
  workflow_call:
    outputs:
      versions:
        description: JSON array of supported Python versions, e.g. '["3.11", "3.12"]'.
        value: ${{ jobs.versions.outputs.versions }}
      default:
        description: Version the release, benchmarks and `latest` images use, e.g. "3.14".
        value: ${{ jobs.versions.outputs.default }}

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      versions: ${{ steps.set.outputs.versions }}
      default: ${{ steps.set.outputs.default }}
    steps:
      - id: set
        shell: bash
        run: |
          versions='["3.11", "3.12", "3.13", "3.14", "3.15"]'
          default="3.14"
          jq -e --arg d "$default" 'index($d) != null' <<<"$versions" > /dev/null \
            || { echo "::error::default Python $default is not in versions $versions"; exit 1; }
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "default=$default" >> "$GITHUB_OUTPUT"
